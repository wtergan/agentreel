[project]
name = "agentreel"
version = "0.1.0"
description = "Turn Claude Code and Codex session logs into a single, shareable, redacted HTML replay."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["claude-code", "codex", "agents", "replay", "observability", "llm"]

[project.scripts]
agentreel = "agentreel.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentreel = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
