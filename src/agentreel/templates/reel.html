  --ok:#7fcf9a;--err:#f08a7a;--err-bg:#2e1c19;--add:#16291c;--add-ink:#8fd6a6;--del:#2f1a17;--del-ink:#f2a092;

:root[data-theme="dark"]{
  --bg:#141311;--panel:#1c1a17;--ink:#ece7dc;--muted:#9b9486;--line:#2e2b26;--soft:#24221e;
  --user:#8fc9b4;--user-bg:#1d2a25;--asst:#ece7dc;--think:#cdb877;--tool:#a9b6f2;--tool-bg:#1e2233;
  --ok:#7fcf9a;--err:#f08a7a;--err-bg:#2e1c19;--add:#16291c;--add-ink:#8fd6a6;--del:#2f1a17;--del-ink:#f2a092;
  --accent:#e98a5c;--code-bg:#211f1b;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}

.wrap{max-width:920px;margin:0 auto;padding:0 16px}
header.hero{padding:40px 0 18px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.badge.src{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:22px 0 14px}
.stat{background:var(--panel);padding:12px 14px}
.stat b{display:block;font:600 22px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.stat span{font:11px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toolmix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}

.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:18px}

.chip{display:inline-flex;gap:6px;align-items:center;user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
input[type=search]{flex:1;min-width:140px;font:13px var(--sans);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}

.strip .head{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent);pointer-events:none;transition:left .15s}
main{padding:22px 0 80px}
.ev{margin:0 0 14px;animation:in .25s ease both}

.meta .who{font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.user .bubble{background:var(--user-bg);border:1px solid color-mix(in srgb,var(--user) 25%,transparent);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.user .who{color:var(--user)}
.assistant .body{padding:2px 2px 0;overflow-wrap:anywhere}
.assistant .who{color:var(--asst)}
.body p{margin:.4em 0}.body h2,.body h3,.body h4{font-family:var(--serif);margin:.8em 0 .3em}
.body ul,.body ol{margin:.3em 0;padding-left:1.4em}
.body code{font:12.5px var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{font:12.5px/1.5 var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:6px 0;max-height:420px;white-space:pre}

.tool .sum{font:12.5px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tool .st{flex:none;font:600 11px var(--mono)}
.tool .st.ok{color:var(--ok)}.tool .st.err{color:var(--err)}.tool .st.na{color:var(--muted)}
.tool.err details{border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
.tool .inner{padding:0 12px 10px}
.tool .lbl{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 2px}
.out.err{background:var(--err-bg)}
.d-add{background:var(--add);color:var(--add-ink);display:block}
.d-del{background:var(--del);color:var(--del-ink);display:block}
.d-hdr{color:var(--accent);display:block;font-weight:600}
.system .note{font:12.5px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.system.err .note{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:2px}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font:12px var(--mono)}

@media (max-width:560px){.bar .wrap{gap:6px}.hide-sm{display:none}}
</style>

<header class="hero"><div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="stats" id="stats"></div>
  <div class="toolmix" id="toolmix" role="img" aria-label="Tool call mix"></div>
  <div class="legend" id="legend"></div>
  <details class="files" id="files" hidden><summary></summary><ul></ul></details>
</div></header>

<div class="bar"><div class="wrap">
  <button class="primary" id="play" title="Play / pause (space)">▶ Replay</button>
  <select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="3" selected>3×</option><option value="10">10×</option><option value="40">40×</option></select>
  <label class="chip"><input type="checkbox" id="f-think" checked>thinking</label>
  <label class="chip"><input type="checkbox" id="f-tool" checked>tools</label>
  <label class="chip hide-sm"><input type="checkbox" id="f-expand">expand all</label>
  <input type="search" id="q" placeholder="Search session…  ( / )">
  <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  <div class="strip" id="strip" title="Session timeline — click to jump"><canvas></canvas><div class="head" id="head"></div></div>
</div></div>

<footer><div class="wrap">
  <span id="foot"></span>

</div></footer>

<script id="reel-data" type="application/json">/*__REEL_DATA__*/null</script>
<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("reel-data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTok = n => n >= 1e9 ? (n/1e9).toFixed(1)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const fmtDur = s => { s = Math.round(s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}h ${String(m).padStart(2,"0")}m` : m ? `${m}m ${String(x).padStart(2,"0")}s` : `${x}s`; };
const clock = t => t == null ? "" : "+" + fmtDur(t);
const PALETTE = ["#3b4a8c","#c2562b","#2f7a4b","#8a5a9e","#b08a1e","#2a7b8c","#9b3d5a","#5c6b2e","#6b665c"];

/* ---------- header ---------- */
const S = D.stats, U = D.usage;
$("#title").textContent = D.title || "Untitled session";
document.title = (D.title || "Session") + " · agentreel";
const srcName = {"claude-code":"Claude Code", codex:"Codex"}[D.source] || D.source;
const started = D.started ? new Date(D.started) : null;
$("#eyebrow").innerHTML = [
  `<span class="badge src">${esc(srcName)}</span>`,
  ...D.models.map(m => `<span class="badge">${esc(m)}</span>`),
  started ? `<span>${esc(started.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}))}</span>` : ""
].join("");
$("#sub").textContent = D.cwd || "";
const statRows = [
  [fmtDur(S.active_seconds), "active time"],
  [S.turns, "user turns"],
  [S.tool_calls, "tool calls"],
  [S.tool_calls ? Math.round(100*(1 - S.tool_errors/S.tool_calls)) + "%" : "—", "tool success"],
  [S.files.length, "files edited"],
  [fmtTok(U.total), "tokens"],
];
$("#stats").innerHTML = statRows.map(([b,s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
const colorOf = {}; S.tools.forEach(([n], i) => colorOf[n] = PALETTE[Math.min(i, PALETTE.length-1)]);
const top = S.tools.slice(0, 8), rest = S.tools.slice(8).reduce((a,[,c]) => a+c, 0);
const mix = rest ? [...top, ["other", rest]] : top;
$("#toolmix").innerHTML = mix.map(([n,c]) => `<i style="flex:${c};background:${colorOf[n]||PALETTE[8]}" title="${esc(n)}: ${c}"></i>`).join("");
$("#legend").innerHTML = mix.map(([n,c]) => `<span><i style="background:${colorOf[n]||PALETTE[8]}"></i>${esc(n)} ${c}</span>`).join("");
if (S.files.length) {
  const f = $("#files"); f.hidden = false;
  $("summary", f).textContent = `${S.files.length} file${S.files.length>1?"s":""} edited`;
  $("ul", f).innerHTML = S.files.map(p => `<li>${esc(p)}</li>`).join("");
}
const red = Object.entries(D.redactions).filter(([,n]) => n);
$("#foot").textContent = [
  `session ${D.id}`,
  red.length ? `redacted: ${red.map(([k,n]) => `${n} ${k}`).join(", ")}` : "no redactions applied",
  D.omitted_chars ? `${fmtTok(D.omitted_chars)} chars of tool output trimmed` : ""
].filter(Boolean).join(" · ");

/* ---------- markdown-lite (input is escaped first; only safe tags are produced) ---------- */
function inline(s) {
  return s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>');
}
function md(src) {
  const out = []; const lines = esc(src).split("\n"); let i = 0, list = null, para = [];
  const flush = () => { if (para.length) { out.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; }
                        if (list) { out.push(`</${list}>`); list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { flush(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      out.push("<pre>" + buf.join("\n") + "</pre>"); i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); const h = Math.min(m[1].length + 1, 4); out.push(`<h${h}>${inline(m[2])}</h${h}>`); }
    else if ((m = l.match(/^\s*([-*]|\d+\.)\s+(.*)/))) { if (para.length) { const l2 = list; list = null; flush(); list = l2; }
      const t = /\d/.test(m[1]) ? "ol" : "ul"; if (list !== t) { if (list) out.push(`</${list}>`); out.push(`<${t}>`); list = t; }
      out.push("<li>" + inline(m[2]) + "</li>"); }
    else if (!l.trim()) flush();
    else { if (list) { out.push(`</${list}>`); list = null; } para.push(l); }
    i++;
  }
  flush(); return out.join("");
}
function codeBlock(text, kind, extra = "") {
  if (kind !== "diff") return `<pre class="${extra}">${esc(text)}</pre>`;
  const body = String(text).split("\n").map(l => {
    const e = esc(l);
    if (/^\*\*\* |^@@/.test(l)) return `<span class="d-hdr">${e}</span>`;
    if (l.startsWith("+")) return `<span class="d-add">${e}</span>`;
    if (l.startsWith("-")) return `<span class="d-del">${e}</span>`;
    return e + "\n";
  }).join("");
  return `<pre class="${extra}">${body}</pre>`;
}

/* ---------- events ---------- */
const log = $("#log");
const nodes = D.events.map((e, idx) => {
  const el = document.createElement("section");
  el.className = `ev ${e.k === "tool_call" || e.k === "tool_result" ? "tool" : e.k}` + (e.err ? " err" : "");
  el.dataset.idx = idx;
  const t = `<span>${esc(clock(e.t))}</span>`;
  if (e.k === "user") el.innerHTML = `<div class="meta"><span class="who">you</span>${t}</div><div class="bubble">${esc(e.x)}</div>`;
  else if (e.k === "assistant") el.innerHTML = `<div class="meta"><span class="who">agent</span>${t}</div><div class="body">${md(e.x)}</div>`;
  else if (e.k === "thinking") el.innerHTML = `<details><summary>thinking ${esc(clock(e.t))}</summary><div class="tx">${esc(e.x)}</div></details>`;
  else if (e.k === "system") el.innerHTML = `<div class="note">${esc(e.x)}</div>`;
  else {
    const has = "out" in e;
    const st = !has ? `<span class="st na">·</span>` : e.err ? `<span class="st err">✕ error</span>` : `<span class="st ok">✓</span>`;
    const name = e.tool || "result";
    el.innerHTML = `<details><summary><span class="name" style="color:${colorOf[name]||"var(--tool)"}">${esc(name)}</span>
      <span class="sum">${esc(e.summary ?? (e.x||"").split("\n")[0])}</span>${st}</summary><div class="inner">
      ${e.detail != null ? `<div class="lbl">input</div>${codeBlock(e.detail, e.dk)}` : ""}
      ${has ? `<div class="lbl">output</div>${codeBlock(e.out || "(empty)", "text", "out" + (e.err ? " err" : ""))}` : ""}
      ${e.k === "tool_result" ? codeBlock(e.x, "text", "out") : ""}</div></details>`;
    if (e.err) el.classList.add("err");
  }
  log.appendChild(el);
  return el;
});
if (!nodes.length) log.innerHTML = `<div class="empty">This session has no events.</div>`;

/* ---------- filters & search ---------- */
const fThink = $("#f-think"), fTool = $("#f-tool"), fExp = $("#f-expand"), q = $("#q");
let revealed = nodes.length; // number of events visible in playback (all, when not playing)
function visibleByFilter(e) {
  if (e.k === "thinking" && !fThink.checked) return false;
  if ((e.k === "tool_call" || e.k === "tool_result") && !fTool.checked) return false;
  return true;
}
function applyFilters() {
  const term = q.value.trim().toLowerCase();
  D.events.forEach((e, i) => {
    const el = nodes[i];
    let show = visibleByFilter(e) && i < revealed;
    if (show && term) show = (e.x || "" ).toLowerCase().includes(term) || (e.summary||"").toLowerCase().includes(term)
      || (e.detail||"").toLowerCase().includes(term) || (e.out||"").toLowerCase().includes(term) || (e.tool||"").toLowerCase().includes(term);
    el.classList.toggle("hidden", !show);
  });
}
[fThink, fTool].forEach(x => x.addEventListener("change", applyFilters));
fExp.addEventListener("change", () => document.querySelectorAll(".tool details,.thinking details").forEach(d => d.open = fExp.checked));
let qTimer; q.addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(applyFilters, 120); });

/* ---------- timeline strip ---------- */
const strip = $("#strip"), canvas = $("canvas", strip), head = $("#head");
const KIND_COLOR = () => { const cs = getComputedStyle(document.documentElement);
  return {user: cs.getPropertyValue("--user"), assistant: cs.getPropertyValue("--muted"), thinking: cs.getPropertyValue("--think"),
          system: cs.getPropertyValue("--line"), err: cs.getPropertyValue("--err"), soft: cs.getPropertyValue("--soft")}; };
function drawStrip() {
  const dpr = window.devicePixelRatio || 1, w = strip.clientWidth, h = strip.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const C = KIND_COLOR(); ctx.fillStyle = C.soft; ctx.fillRect(0, 0, w, h);
  const n = Math.max(nodes.length, 1), bw = Math.max(w / n, 1);
  D.events.forEach((e, i) => {
    const x = i / n * w;
    let col, y = 0, hh = h;
    if (e.err) col = C.err;
    else if (e.k === "user") col = C.user;
    else if (e.k === "tool_call" || e.k === "tool_result") { col = colorOf[e.tool] || PALETTE[8]; y = h * .3; hh = h * .7; }
    else if (e.k === "thinking") { col = C.thinking; y = h * .55; hh = h * .45; }
    else { col = C.assistant; y = h * .45; hh = h * .55; }
    ctx.fillStyle = col; ctx.fillRect(x, y, Math.ceil(bw), hh);
  });
}
function setHead(i) { head.style.left = (Math.min(i, nodes.length) / Math.max(nodes.length,1) * 100) + "%"; }
function eventAtX(clientX) { const r = strip.getBoundingClientRect(); return Math.floor((clientX - r.left) / r.width * nodes.length); }
strip.addEventListener("click", ev => { const i = Math.max(0, Math.min(nodes.length - 1, eventAtX(ev.clientX)));
  if (playing) { revealed = i + 1; applyFilters(); } focusEvent(i); });
strip.addEventListener("mousemove", ev => { const e = D.events[eventAtX(ev.clientX)];
  if (e) strip.title = `${e.k === "tool_call" ? e.tool : e.k} ${clock(e.t)}`; });
window.addEventListener("resize", drawStrip);

let cur = 0;
function focusEvent(i) {
  cur = i; setHead(i);
  const el = nodes[i]; if (!el) return;
  if (el.classList.contains("hidden")) { revealed = Math.max(revealed, i + 1); q.value = ""; applyFilters(); }
  el.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
const io = new IntersectionObserver(ents => { ents.forEach(en => { if (en.isIntersecting && !playing) setHead(+en.target.dataset.idx); }); },
  {rootMargin: "-45% 0px -45% 0px"});
nodes.forEach(n => io.observe(n));

/* ---------- playback: reveal events using real inter-event gaps, compressed ---------- */
const playBtn = $("#play"), speed = $("#speed");
let playing = false, timer = null;
function gapMs(i) {
  const a = D.events[i - 1], b = D.events[i];
  const real = a && b && a.t != null && b.t != null ? (b.t - a.t) * 1000 : 600;
  return Math.min(Math.max(real, 120), 2500) / (+speed.value);
}
function tick() {
  if (!playing) return;
  if (revealed >= nodes.length) { stop(); return; }
  revealed++; applyFilters();
  const i = revealed - 1; setHead(revealed);
  if (!nodes[i].classList.contains("hidden")) nodes[i].scrollIntoView({block: "end", behavior: "smooth"});
  timer = setTimeout(tick, gapMs(revealed));
}
function start() { if (revealed >= nodes.length) revealed = 0; playing = true; playBtn.textContent = "❚❚ Pause"; applyFilters();
  window.scrollTo({top: $("main").offsetTop - 80}); timer = setTimeout(tick, 200); }
function stop() { playing = false; clearTimeout(timer); playBtn.textContent = revealed >= nodes.length ? "▶ Replay" : "▶ Resume"; }
playBtn.addEventListener("click", () => playing ? stop() : start());

/* ---------- theme & keys ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem("agentreel-theme"); if (t) root.dataset.theme = t; } catch {}
$("#theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("agentreel-theme", root.dataset.theme); } catch {}
  drawStrip();
});
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input,select,textarea")) { if (ev.key === "Escape") ev.target.blur(); return; }
  if (ev.key === " ") { ev.preventDefault(); playing ? stop() : start(); }
  else if (ev.key === "/") { ev.preventDefault(); q.focus(); }
  else if (ev.key === "j" || ev.key === "k") {
    const dir = ev.key === "j" ? 1 : -1; let i = cur + dir;
    while (i >= 0 && i < nodes.length && nodes[i].classList.contains("hidden")) i += dir;
    if (i >= 0 && i < nodes.length) focusEvent(i);
  }
});
drawStrip(); setHead(0);
})();
</script>
</body>
</html>
